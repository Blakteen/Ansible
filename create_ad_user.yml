---
- name: Crear usuario en Active Directory
  hosts: all
  gather_facts: no
  vars:
    username: "{{ ad_username }}"                       # Nombre de cuenta (samAccountName)
    password: "{{ ad_password }}"                       # Contraseña
    logon_name: "{{ ad_logon_name }}"                   # UPN (usuario@dominio.local)
    description: "{{ ad_description | default('Usuario creado por Ansible') }}"
    groups: "{{ ad_groups | default([]) }}"             # Lista de grupos AD a los que se añadirá
    ou: "{{ ad_ou | default('OU=Usuarios,DC=midominio,DC=local') }}"  # Unidad organizativa
    enabled: true                                      # Estado del usuario

  tasks:
    - name: Crear usuario en Active Directory
      ansible.windows.win_ad_user:
        name: "{{ username }}"
        user_principal_name: "{{ logon_name }}"
        password: "{{ password }}"
        enabled: "{{ enabled }}"
        description: "{{ description }}"
        groups: "{{ groups }}"
        ou: "{{ ou }}"
        change_password_at_logon: false
        password_never_expires: yes
