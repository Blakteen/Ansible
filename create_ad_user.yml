---
- name: Crear un usuario local en Windows
  hosts: all
  gather_facts: no
  vars:
    username: "{{ new_user }}"                # Nombre de la cuenta (samAccountName) desde AWX
    password: "{{ new_password }}"            # Contraseña desde AWX
    logon_name: "{{ user_logon_name | default(omit) }}"  # Logon name opcional desde AWX
    description: "{{ user_description | default('Usuario creado por Ansible') }}"  # Descripción
    groups: "{{ user_groups | default(['Usuarios']) }}"  # Grupo(s) del usuario, por defecto 'Usuarios'

  tasks:
    - name: Crear usuario local en Windows
      ansible.windows.win_user:
        name: "{{ username }}"
        password: "{{ password }}"
        state: present
        description: "{{ description }}"
        groups: "{{ groups }}"
        update_password: on_create
        password_never_expires: yes
        user_cannot_change_password: no
        user_principal_name: "{{ logon_name }}"

