---
- name: Crear usuario en AD con contraseña generada en PowerShell
  hosts: all
  gather_facts: no
  vars:
    ad_username: "{{ ad_username }}"
    ad_display_name: "{{ ad_username | capitalize }}"
    ad_logon_name: "{{ ad_username }}@mingrat.lab"
    ad_ou: "OU=Usuarios,DC=mingrat,DC=lab"

  tasks:
    - name: Generar contraseña segura con PowerShell (sin saltos de línea)
      win_shell: |
        # Lista de palabras
        $palabras = @("Lunes", "Rojo", "Dedo", "Casa", "Perro", "Gato", "Sol", "Cielo", "Reloj", "Silla", "Mesa", "Viento", "Mar", "Flor", "Piedra", "Libro", "Puerta", "Ventana", "Camino", "Montaña", "Rio", "Nube", "Arbol", "Hoja")
        $caracteres = @("!", "@", "#", "$", "%", "&", "*", "-", "_", "+", "=")
        
        # Seleccionar palabras aleatorias
        $palabra1 = $palabras | Get-Random
        $palabra2 = $palabras | Get-Random
        $palabra3 = $palabras | Get-Random
        
        # Generar números aleatorios
        $numero1 = Get-Random -Minimum 0 -Maximum 9
        $numero2 = Get-Random -Minimum 0 -Maximum 9
        
        # Seleccionar carácter especial
        $caracter = $caracteres | Get-Random
        
        # Construir contraseña SIN saltos de línea
        $password = $palabra1 + $palabra2 + $palabra3 + $numero1 + $numero2 + $caracter
        
        # Devolver la contraseña sin espacios ni saltos
        $password.Trim()
      register: generated_password
      args:
        executable: powershell

    - name: Limpiar y mostrar contraseña generada
      debug:
        msg: "Contraseña generada: '{{ generated_password.stdout }}'"

    - name: Crear o actualizar usuario en AD
      win_shell: |
        # Limpiar la contraseña de posibles espacios o saltos de línea
        $cleanPassword = "{{ generated_password.stdout }}".Trim()
        
        $SecurePassword = ConvertTo-SecureString $cleanPassword -AsPlainText -Force
        
        try {
            $user = Get-ADUser -Identity "{{ ad_username }}" -ErrorAction Stop
            # Usuario existe - actualizar contraseña
            Set-ADAccountPassword -Identity "{{ ad_username }}" -NewPassword $SecurePassword -Reset
            Enable-ADAccount -Identity "{{ ad_username }}"
            Write-Output "EXISTS_UPDATED"
        } catch {
            # Usuario no existe - crear nuevo
            New-ADUser `
              -Name "{{ ad_display_name }}" `
              -SamAccountName "{{ ad_username }}" `
              -UserPrincipalName "{{ ad_logon_name }}" `
              -AccountPassword $SecurePassword `
              -Enabled $true `
              -Path "{{ ad_ou }}" `
              -DisplayName "{{ ad_display_name }}" `
              -Description "Usuario creado desde AWX" `
              -ChangePasswordAtLogon $false `
              -PasswordNeverExpires $true
            Write-Output "CREATED"
        }
        
        # Agregar a grupo Usuarios del dominio
        try {
            Add-ADGroupMember -Identity "Usuarios del dominio" -Members "{{ ad_username }}" -ErrorAction SilentlyContinue
            Write-Output "ADDED_TO_GROUP"
        } catch {
            # Ignorar si ya es miembro
            Write-Output "ALREADY_IN_GROUP"
        }
      register: user_operation
      args:
        executable: powershell

    - name: Mostrar resumen final
      debug:
        msg: |
          🎉 USUARIO CONFIGURADO EN ACTIVE DIRECTORY
          ─────────────────────────────────────────
          👤 Usuario: {{ ad_username }}
          📝 Nombre: {{ ad_display_name }}
          📧 Email: {{ ad_logon_name }}
          🔐 Contraseña: {{ generated_password.stdout }}
          📍 OU: {{ ad_ou }}
          
          {% if "EXISTS" in user_operation.stdout %}
          🔄 Acción: Contraseña actualizada
          {% else %}
          ✅ Acción: Usuario creado
          {% endif %}
          
          {% if "ADDED" in user_operation.stdout %}
          📋 Grupo: Agregado a Usuarios del dominio
          {% else %}
          📋 Grupo: Ya estaba en Usuarios del dominio
          {% endif %}
          
          💡 INICIAR SESIÓN CON:
          • Usuario: {{ ad_username }}
          • Contraseña: {{ generated_password.stdout }}
